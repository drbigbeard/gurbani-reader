name: Build installable Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VITE_ENHANCED_SPEECH_URL: ${{ secrets.ENHANCED_SPEECH_URL }}
      VITE_ENHANCED_SPEECH_TOKEN: ${{ secrets.ENHANCED_SPEECH_TOKEN }}
    defaults:
      run:
        working-directory: gurbani-reader-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: gurbani-reader-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test the Punjabi speech service
        working-directory: services/punjabi-speech-proxy
        run: |
          npm ci
          npm test
      - name: Preserve the private local-install signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gurbani-reader-local-signing-v1
          save-always: true
      - name: Create the permanent local-install signing key when first needed
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Gurbani Reader Local Install,O=Gurbani Reader,C=GB" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - run: npm ci
      - name: Require enhanced Punjabi speech configuration for release builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -n "$VITE_ENHANCED_SPEECH_URL" || {
            echo "::error::Missing GitHub secret: ENHANCED_SPEECH_URL"
            exit 1
          }
          test -n "$VITE_ENHANCED_SPEECH_TOKEN" || {
            echo "::error::Missing GitHub secret: ENHANCED_SPEECH_TOKEN"
            exit 1
          }
      - name: Restore checksummed v5 base reading database
        run: npm run corpus:restore
      - name: Fetch and verify the v0.13 BaniDB source snapshot
        env:
          SNAPSHOT_GENERATED_AT: 2026-07-19T00:00:00.000Z
          EXPECTED_SNAPSHOT_SHA256: e49b1f372aa59e59cb8ba0a9a5c97d72491fe58089ad43d7148416aaf6886f38
        run: npm run data:fetch-v013 -- "$RUNNER_TEMP/v013-banidb-snapshot"
      - name: Build the v6 reading database from verified sources
        run: npm run data:upgrade-v6 -- public/assets/databases/gurbani_reader_v5SQLite.db public/assets/databases/gurbani_reader_v6SQLite.db "$RUNNER_TEMP/v013-banidb-snapshot"
      - name: Build the v7 normalised search database
        run: npm run data:upgrade-v7 -- public/assets/databases/gurbani_reader_v6SQLite.db public/assets/databases/gurbani_reader_v7SQLite.db
      - name: Build the v8 tolerant ranked search database
        run: npm run data:upgrade-v8 -- public/assets/databases/gurbani_reader_v7SQLite.db public/assets/databases/gurbani_reader_v8SQLite.db
      - name: Build the v9 corrected TGGSP alignment database
        run: npm run data:upgrade-v9 -- public/assets/databases/gurbani_reader_v8SQLite.db public/assets/databases/gurbani_reader_v9SQLite.db
      - name: Build the v10 strict TGGSP line-or-passage database
        run: npm run data:upgrade-v10 -- public/assets/databases/gurbani_reader_v9SQLite.db public/assets/databases/gurbani_reader_v10SQLite.db
      - run: npm run check
      - run: npm run audit:rc
      - name: Keep only the current database in the APK
        run: npm run native:prepare-assets
      - run: npm run build:native
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: gurbani-reader-app/android
      - name: Align, sign and verify the installable APK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -f "$HOME/.android/debug.keystore"
          "$ZIPALIGN" -P 16 -f 4 \
            android/app/build/outputs/apk/debug/app-debug.apk \
            Shabad-Sojhi-v0.16.0-rc5-aligned.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Shabad-Sojhi-v0.16.0-rc5-Android.apk \
            Shabad-Sojhi-v0.16.0-rc5-aligned.apk
          "$ZIPALIGN" -c -P 16 -v 4 Shabad-Sojhi-v0.16.0-rc5-Android.apk
          "$APKSIGNER" verify --verbose --print-certs Shabad-Sojhi-v0.16.0-rc5-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shabad-Sojhi-v0.16.0-rc5-Android
          path: gurbani-reader-app/Shabad-Sojhi-v0.16.0-rc5-Android.apk
          if-no-files-found: error
      - name: Publish installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.16.0-rc.5
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Shabad Sojhi v0.16 RC5" --notes-file RELEASE_NOTES_v0.16-rc5.md
          gh release upload "$TAG" Shabad-Sojhi-v0.16.0-rc5-Android.apk --clobber
